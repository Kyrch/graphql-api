[package]
name = "animethemes-graphql-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-graphql = { version = "7.2.1", features = ["chrono", "dataloader", "graphiql"] }
async-graphql-axum = "7.2.1"

axum = "0.8"
chrono = "0.4.45"
dotenvy = "0.15"
sea-orm = { version = "2.0.0", features = ["sqlx-mysql", "runtime-tokio-rustls"] }
serde = "1.0.229"
tokio = { version = "1", features = ["full"] }
typesense = "0.4.0"
